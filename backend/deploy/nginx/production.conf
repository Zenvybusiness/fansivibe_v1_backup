# Fansivibe Production Nginx Reverse Proxy & Canary Traffic Splitter (Phase 3AN)

# Upstream pool for baseline stable production instances
upstream backend_primary {
    server backend-primary:8000;
    keepalive 32;
}

# Upstream pool for canary release instances
upstream backend_canary {
    server backend-canary:8001;
    keepalive 32;
}

# Correlation ID generation / propagation
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Deterministic Canary Traffic Splitting: 5% of traffic routed to canary upstream
# Based on hash of correlation ID ($req_id)
split_clients $req_id $backend_upstream {
    5.0%    backend_canary;
    *       backend_primary;
}

# Map upstream to canary boolean header for downstream observability
map $backend_upstream $is_canary {
    backend_canary   "true";
    backend_primary  "false";
}

# 1. HTTP Ingress -> HTTPS 301 Permanent Redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fansivibe.com app.fansivibe.com api.fansivibe.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Ingress & TLS Termination
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name fansivibe.com app.fansivibe.com api.fansivibe.com;

    # TLS Certificates & Security Invariants
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request Body Size Bound (2MB max)
    client_max_body_size 2M;

    # Cascading Timeout Hierarchy (Layer 4: 90s Gateway Deadline)
    # Exceeds Flutter client timeout (75s) and Backend deadline (65s)
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # HTTP/1.1 & Connection reuse
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Forwarding Headers
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Canary $is_canary;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security: Explicitly block Swagger/Redoc endpoints in production
    location ~* ^/(docs|redoc|openapi.json) {
        return 404 '{"error":{"code":"NOT_FOUND","message":"API documentation is disabled in production."}}';
    }

    # Security: Restrict /metrics to internal scraper IP or subnet
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://$backend_upstream;
        add_header X-Request-Id $req_id always;
        add_header X-Proxy-By "Fansivibe-Production-Nginx" always;
    }

    # Main Application Routing with Traffic Splitting
    location / {
        proxy_pass http://$backend_upstream;

        # Observability & Provenance Headers
        add_header X-Request-Id $req_id always;
        add_header X-Canary $is_canary always;
        add_header X-Proxy-By "Fansivibe-Production-Nginx" always;
    }
}
