# Fansivibe Staging Nginx Reverse Proxy Configuration (Phase 3AM)

# Upstream definition for backend FastAPI service
upstream backend_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Generate UUID for request ID if not provided by client
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost staging.fansivibe.internal _;

    # Request size bounding (protects backend memory)
    client_max_body_size 2M;

    # Cascading Timeout Hierarchy (Layer 4: 90s gateway deadline)
    # Exceeds Flutter client timeout (75s) and backend handler deadline (65s)
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Buffering & HTTP settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Correlation ID & Client Header Propagation
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy all traffic to FastAPI backend
    location / {
        proxy_pass http://backend_api;
        
        # Add correlation ID to downstream responses
        add_header X-Request-Id $req_id always;
        add_header X-Proxy-By "Fansivibe-Staging-Nginx" always;
    }
}
