services:
  ollama:
    image: ollama/ollama:latest
    container_name: fansivibe-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    command: serve

  postgres:
    image: postgres:16
    container_name: fansivibe-postgres
    environment:
      POSTGRES_USER: fansivibe
      POSTGRES_PASSWORD: fansivibe_dev
      POSTGRES_DB: fansivibe
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  ollama:
  postgres:
